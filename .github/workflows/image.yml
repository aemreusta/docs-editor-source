name: image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: date
        run: echo "value=$(git log -1 --format=%cs -- branding Dockerfile)" >> "$GITHUB_OUTPUT"
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name == 'main' && 'main' || github.ref_name }}
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            MODIFICATION_DATE=${{ steps.date.outputs.value }}
      - run: echo "digest ${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
